<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>西安秋季团建 · 方案版本</title><style>
*{box-sizing:border-box}html,body{margin:0;height:100%;font-family:system-ui,"Microsoft YaHei",sans-serif;background:#f4f3ec;color:#22322a}body{height:100dvh;display:flex;flex-direction:column;overflow:hidden}header{flex:none;padding:12px 24px;background:white;border-top:4px solid #23523d;border-bottom:1px solid #dbe0d4;box-shadow:0 2px 6px #22322a0b;z-index:2}.bar{display:flex;align-items:center;justify-content:space-between;gap:18px;max-width:1440px;margin:auto}h1{font-size:18px;margin:0;line-height:1.4}.subtitle{font-size:12px;color:#637469;margin:3px 0 0}.controls{display:flex;gap:9px;align-items:center;flex:none}label{font-size:13px;color:#23523d;white-space:nowrap}select{font:inherit;font-size:13px;padding:9px 10px;border:1px solid #b9c9bb;border-radius:8px;background:#f9fbf7;color:#23523d;max-width:330px}a{font-size:12px;color:#23523d;white-space:nowrap}#plan-frame{flex:1;min-height:0;width:100%;border:0;background:#f4f3ec}#state{font-size:11px;color:#637469}.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0)}@media(max-width:680px){header{padding:9px 12px}.bar{display:block}h1{font-size:15px}.subtitle{font-size:11px;margin-bottom:7px}.controls{gap:6px}select{flex:1;min-width:0;font-size:12px;max-width:none;padding:7px}label{font-size:12px}.direct{display:none}#state{display:none}}
</style></head><body><header><div class="bar"><div><h1>西安秋季团建 · 版本留档</h1><p class="subtitle" id="version-note">最新保留1—6号＋新增11号捡秋；历史版本完整保留。</p></div><div class="controls"><label for="version-select">方案版本</label><select id="version-select"><option value="v5">V5 · 按场地整合（6个场地）· 最新</option><option value="v4">V4 · 新增捡秋手作（7个候选）</option><option value="v3">V3 · 老板方向细化（6个候选）</option><option value="v2">V2 · 大众点评核价（10个候选）</option><option value="v1">V1 · 初稿调研（10个候选）</option></select><a id="direct" class="direct" target="_blank" rel="noopener" href="versions/v5.html">单独打开当前版 ↗</a><span id="state" aria-live="polite">加载中</span></div></div></header><iframe id="plan-frame" title="当前选择版本的完整团建方案" src="versions/v5.html"></iframe><script>
const labels={v5:'V5最新：6个场地；4＋11合并，昆明池和长安公园可选活动，其余不强求二选一。',v4:'V4历史：保留1—6号，新增11号捡秋；每人一框，不比赛。旧7—10号仍淘汰。',v3:'V3历史：保留1—6号；7—10号已淘汰。租车441元为用户提供价，详情见方案。',v2:'V2历史：保留大众点评核价时的10个方案；已淘汰项仅供回看，当前决策以V5为准。',v1:'V1历史：保留初稿10个方案及当时估算；后续价格与场地修正请看V2/V3。'};
const select=document.getElementById('version-select'),frame=document.getElementById('plan-frame'),direct=document.getElementById('direct'),note=document.getElementById('version-note'),state=document.getElementById('state');
function showVersion(v,updateUrl){if(!labels[v])v='v5';select.value=v;const src='versions/'+v+'.html';if(frame.getAttribute('src')!==src){state.textContent='加载中';frame.src=src}direct.href=src;note.textContent=labels[v];document.title='西安秋季团建 · '+v.toUpperCase();if(updateUrl){const url=new URL(location.href);url.searchParams.set('version',v);history.replaceState(null,'',url)}}
frame.addEventListener('load',()=>{state.textContent='已加载'});select.addEventListener('change',()=>showVersion(select.value,true));window.addEventListener('popstate',()=>showVersion(new URLSearchParams(location.search).get('version')||'v5',false));showVersion(new URLSearchParams(location.search).get('version')||'v5',false);
</script></body></html>
